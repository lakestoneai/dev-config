name: Lakestone setup-bun
description: Bun from package.json packageManager, the Bun install cache, then `bun install --frozen-lockfile` (retried once on a network error). Checkout first.
inputs:
  working-directory:
    description: Folder with package.json and bun.lock
    default: .
  install:
    description: Run `bun install --frozen-lockfile` (false = Bun + cache only)
    default: 'true'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ inputs.working-directory }}/package.json
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles(format('{0}/**/bun.lock', inputs.working-directory)) }}
        restore-keys: ${{ runner.os }}-bun-
    - name: bun install --frozen-lockfile
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile || { echo "::warning::bun install failed, retrying once in 10 s"; sleep 10; bun install --frozen-lockfile; }
