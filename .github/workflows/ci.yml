name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun # dogfood: every package build tests the shared action
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
  renovate-preset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Preset holds no repo-specific keys
        run: |
          bad=$(jq -r '[keys[] | select(. == "constraints" or . == "baseBranchPatterns" or . == "baseBranches")] | join(" ")' default.json)
          if [ -n "$bad" ]; then echo "::error::default.json must not set repo-specific keys: $bad"; exit 1; fi
      - name: Renovate validates the preset
        run: bunx -p renovate@44.216.5 renovate-config-validator --no-global --strict default.json
