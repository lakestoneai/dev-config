# Stages a release on npm when a GitHub release is published, via npm trusted publishing (OIDC): no npm
# token stored anywhere. The trusted publisher is stage-only, so nothing goes live until a maintainer
# approves it with 2FA (npmjs.com → Staged Packages, or `npm stage approve <id>`).
# npm side: package settings → Trusted publisher → GitHub Actions, lakestoneai/dev-config, publish.yml.
# `npm stage publish` needs npm >= 11.15.0 and Node >= 22.14 (docs.npmjs.com/staged-publishing).
# bun publish has no OIDC or staging support (bun.com/docs/pm/cli/publish), so this job uses npm.
name: Stage release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  stage:
    needs: test
    runs-on: ubuntu-latest # GitHub-hosted runner required for provenance
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm install -g npm@^11.15.0
      - run: npm stage publish
